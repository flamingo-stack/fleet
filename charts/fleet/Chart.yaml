# OPENFRAME(helm): fork-maintained chart — openframe/docs/helm-chart.md
apiVersion: v2
description: A Helm chart for Fleet
name: fleet
keywords:
  - fleet
  - osquery
version: v7.0.16
home: https://github.com/fleetdm/fleet
sources:
  - https://github.com/fleetdm/fleet.git
appVersion: v4.90.1
dependencies:
  - name: mysql
    condition: mysql.enabled
    version: 9.12.5
    repository: https://charts.bitnami.com/bitnami
  - name: redis
    condition: redis.enabled
    version: 18.1.6
    repository: https://charts.bitnami.com/bitnami
